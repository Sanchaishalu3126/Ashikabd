<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Secure System Entry</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="system-title">
            SECURE SYSTEM ENTRY
        </div>


        <div class="profile">

            <img
                src="img/friend.jpg"
                alt="Friend"
            >

        </div>


        <div class="subtitle">
            ENTER ACCESS CODE
        </div>


        <div
            class="pass-display"
            id="passDisplay"
        >

            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


        <div class="keypad">


            <!-- 1 2 3 -->

            <button
                type="button"
                class="key"
                data-number="1"
            >
                1
            </button>

            <button
                type="button"
                class="key"
                data-number="2"
            >
                2
            </button>

            <button
                type="button"
                class="key"
                data-number="3"
            >
                3
            </button>


            <!-- 4 5 6 -->

            <button
                type="button"
                class="key"
                data-number="4"
            >
                4
            </button>

            <button
                type="button"
                class="key"
                data-number="5"
            >
                5
            </button>

            <button
                type="button"
                class="key"
                data-number="6"
            >
                6
            </button>


            <!-- 7 8 9 -->

            <button
                type="button"
                class="key"
                data-number="7"
            >
                7
            </button>

            <button
                type="button"
                class="key"
                data-number="8"
            >
                8
            </button>

            <button
                type="button"
                class="key"
                data-number="9"
            >
                9
            </button>


            <!-- Bottom row -->

            <button
                type="button"
                class="key empty"
            >
            </button>

            <button
                type="button"
                class="key"
                data-number="0"
            >
                0
            </button>

            <button
                type="button"
                class="key delete"
                id="deleteBtn"
            >
                ⌫
            </button>

        </div>


        <div class="hint">
            HINT: It's a special number ❤️
        </div>


    </div>


    <script src="script.js"></script>

</body>

</html>
