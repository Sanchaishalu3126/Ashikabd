<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>It's Your Special Day</title>

    <link rel="stylesheet" href="birthday.css">
</head>

<body>

    <!-- Background particles -->
    <div class="particles"></div>

    <!-- Background glow -->
    <div class="background-glow"></div>


    <main class="birthday-page">


        <!-- TITLE -->

        <section class="birthday-title">

            <h1>
                It's Your
            </h1>

            <h2>
                Special Day 🌺
            </h2>

        </section>


        <!-- LINE -->

        <div class="title-line"></div>


        <!-- PANDA IMAGE -->

        <section class="friend-section">

            <div class="image-ring ring-1"></div>
            <div class="image-ring ring-2"></div>
            <div class="image-ring ring-3"></div>

            <div class="friend-glow"></div>


            <div class="friend-container">

                <img
                    src="img/sleeping-panda.png"
                    alt="Sleeping Panda"
                    class="friend-image"
                >

            </div>

        </section>


        <!-- MESSAGE -->

        <p class="special-message">
            I made something special for you...
        </p>


        <!-- START BUTTON -->

        <button
            id="startButton"
            class="start-button"
            type="button"
        >

            <span>START</span>

            <span class="button-symbol">
                ●⌣●
            </span>

        </button>


    </main>


    <!-- FOOTER -->

    <div class="footer">
        WEBKAIZEN
    </div>


    <script src="birthday.js"></script>

</body>

</html>
