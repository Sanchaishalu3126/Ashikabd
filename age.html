<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>One Special Moment</title>

    <link rel="stylesheet" href="age.css">

</head>

<body>

    <div class="age-container">

        <!-- TOP TEXT -->

        <div class="top-text">
            A LITTLE SOMETHING ABOUT YOUR SPECIAL DAY
        </div>


        <!-- MAIN TITLE -->

        <h1>
            YOUR SPECIAL DAY
        </h1>


        <!-- DATE OF BIRTH -->

        <div class="dob-section">

            <div class="label">
                DATE OF BIRTH
            </div>

            <div class="dob">
                11 / 09 / 2006
            </div>

        </div>


        <!-- AGE -->

        <div class="age-section">

            <div class="label">
                YOUR AGE
            </div>

            <div class="age-number"
                 id="ageNumber">
                20
            </div>

            <div class="years">
                YEARS
            </div>

        </div>


        <!-- TIME SECTION -->

        <div class="countdown-title">
            TIME UNTIL YOUR SPECIAL DAY
        </div>


        <div class="countdown">


            <!-- HOURS -->

            <div class="time-box">

                <div id="hours">
                    175,320
                </div>

                <span>
                    HOURS
                </span>

            </div>


            <!-- MINUTES -->

            <div class="time-box">

                <div id="minutes">
                    10,519,200
                </div>

                <span>
                    MINUTES
                </span>

            </div>


            <!-- SECONDS -->

            <div class="time-box">

                <div id="seconds">
                    631,152,000
                </div>

                <span>
                    SECONDS
                </span>

            </div>


        </div>


        <!-- NEXT BUTTON -->

        <button id="nextButton">

            NEXT →

        </button>


    </div>


    <script src="age.js"></script>

</body>

</html>
